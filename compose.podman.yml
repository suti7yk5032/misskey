# podman で手元の Misskey を動かしてリアクション帳票ページを確認するための compose。
# 使い方:
#   podman build -t misskey-suti7:local .
#   podman-compose -f compose.podman.yml up -d
#   → http://localhost:3000/ （別端末から見る場合は .config/default.yml の url を LAN IP に変更）
#
# 設定は .config/default.yml（url/port/db/redis）と .config/docker.env（PostgreSQL の認証）を参照。

name: misskey-suti7

services:
  web:
    image: misskey-suti7:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - internal
      - external
    volumes:
      - ./files:/misskey/files
      - ./.config:/misskey/.config:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    networks:
      - internal
    env_file:
      - .config/docker.env
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20

networks:
  internal:
    internal: true
  external:
